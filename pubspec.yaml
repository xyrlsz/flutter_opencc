name: flutter_opencc
description: A Flutter FFI plugin for OpenCC (Open Chinese Convert), providing conversion between Simplified Chinese, Traditional Chinese, and regional variants.
version: 1.0.0
homepage: https://github.com/xyrlsz/flutter_opencc

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
